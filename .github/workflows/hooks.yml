# Runs the hook test cases on every PR that touches the hooks: a guardrail
# that silently stops blocking is worse than none. The steps live in the
# reusable workflow in 0xc0-labs/.github.
name: hooks

on:
  pull_request:
    branches: [main]
    paths: ['plugins/homelab/hooks/**', '.github/workflows/hooks.yml']

permissions:
  contents: read

jobs:
  test:
    uses: 0xc0-labs/.github/.github/workflows/hook-tests.yml@main
    with:
      command: plugins/homelab/hooks/tests/run.sh
